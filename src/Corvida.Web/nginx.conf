# Serves the Corvida WebAssembly UI and proxies the API on the same origin.
#
# Same-origin matters twice over: it removes the need for any CORS configuration, and it stops the
# browser from blocking calls to a plain-HTTP API when the page itself is served over HTTPS.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream corvida_api {
    server api:5083;
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;

    server_name _;

    ssl_certificate     /etc/nginx/certs/corvida.crt;
    ssl_certificate_key /etc/nginx/certs/corvida.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # The publish step emits .br/.gz next to each asset; serve them instead of compressing again.
    gzip_static on;

    # Only the fingerprinted assets (name.<hash>.ext) are content-addressed and safe to cache
    # forever. Regex locations are matched before prefix ones, so this wins for those files.
    location ~ "^/_framework/.+\.[a-z0-9]{8,12}\.[a-z0-9]+$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else under /_framework/ — dotnet.js, avalonia.js, storage.js, sw.js — keeps the
    # same name across builds. Caching those hard makes a rebuild invisible to a warm browser:
    # dotnet.js carries the boot manifest, so a stale copy keeps loading the entire previous
    # bundle and the new one is never fetched.
    location /_framework/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /config.json {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://corvida_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /connect/ {
        proxy_pass http://corvida_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR: needs the upgrade headers and a long read timeout, or long-polling and WebSocket
    # connections are torn down every 60 seconds.
    location /hubs/ {
        proxy_pass http://corvida_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Single-page app: unknown paths fall back to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
