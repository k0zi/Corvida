# nfpm configuration for the corvida .deb and .rpm: the desktop app plus the MCP server. Driven by build-packages.sh, which sets
# the CORVIDA_* environment variables, stages the build in artifacts/stage/ and runs nfpm from the repo root.
# nfpm expands ${VAR} in scalar fields (version, prerelease) but NOT in contents src paths.
name: corvida
arch: amd64
platform: linux
version: ${CORVIDA_VERSION}
prerelease: ${CORVIDA_PRERELEASE}
release: 1
section: utils
priority: optional
maintainer: David Kozma <k0zi@outlook.com>
vendor: David Kozma
homepage: https://github.com/k0zi/Corvida
license: MIT
description: |-
  Kanban board manager
  Corvida is a cross-platform Kanban board manager with support for local
  file storage or a hosted Corvida server (container images, see the README).
  Includes the Corvida MCP server (/usr/bin/corvida-mcp), which lets AI tools
  such as Claude Code, OpenCode or Hermes manage boards, tasks and agents;
  register it from the app's Settings page.

# The old dpkg-deb package installed to /opt/corvida; the files move, so nothing else to migrate.
contents:
  # type: tree keeps the directory structure (a trailing-slash glob flattens subfolders and collides).
  - src: artifacts/stage/desktop
    dst: /usr/lib/corvida
    type: tree
  - src: /usr/lib/corvida/Corvida
    dst: /usr/bin/corvida
    type: symlink
  # The MCP server is a second self-contained app. It gets its own folder: two self-contained apps in
  # one directory would overwrite each other's copies of shared assemblies with different versions.
  # It is started by the AI tool as the logged-in user and reads that user's settings.json, so there
  # is no service and no system-wide configuration.
  - src: artifacts/stage/mcp
    dst: /usr/lib/corvida/mcp
    type: tree
  - src: /usr/lib/corvida/mcp/Corvida.Mcp
    dst: /usr/bin/corvida-mcp
    type: symlink
  - src: artifacts/stage/common/corvida.desktop
    dst: /usr/share/applications/corvida.desktop
  - src: artifacts/stage/common/corvida.png
    dst: /usr/share/icons/hicolor/256x256/apps/corvida.png
  # ── licences: Debian policy location vs. RPM %license ──
  - src: artifacts/stage/common/LICENSE
    dst: /usr/share/doc/corvida/copyright
    packager: deb
  - src: artifacts/stage/common/LICENSE
    dst: /usr/share/licenses/corvida/LICENSE
    packager: rpm
    type: license
  - src: artifacts/stage/common/THIRD_PARTY_NOTICES.md
    dst: /usr/share/doc/corvida/THIRD_PARTY_NOTICES.md
  - src: artifacts/stage/common/licenses
    dst: /usr/share/doc/corvida/licenses
    type: tree

# Self-contained .NET build: only native libraries of the base system are needed.
overrides:
  deb:
    depends:
      - libc6
      - libgcc-s1
      - libstdc++6
      - zlib1g
      - libicu80 | libicu79 | libicu78 | libicu77 | libicu76 | libicu75 | libicu74 | libicu73 | libicu72 | libicu71 | libicu70 | libicu67
      - libssl3t64 | libssl3 | libssl1.1
      - libx11-6
      - libice6
      - libsm6
      - libxcursor1
      - libxext6
      - libxfixes3
      - libxi6
      - libxrandr2
      - libfontconfig1
    recommends:
      - libgl1
      - libegl1
      - libgtk-3-0t64 | libgtk-3-0
  rpm:
    # Shared-library capabilities have the same names on Fedora/RHEL and openSUSE, unlike the package names.
    depends:
      - libstdc++.so.6()(64bit)
      - libz.so.1()(64bit)
      - (libicuuc.so.80()(64bit) or libicuuc.so.79()(64bit) or libicuuc.so.78()(64bit) or libicuuc.so.77()(64bit) or libicuuc.so.76()(64bit) or libicuuc.so.75()(64bit) or libicuuc.so.74()(64bit) or libicuuc.so.73()(64bit) or libicuuc.so.72()(64bit) or libicuuc.so.71()(64bit) or libicuuc.so.70()(64bit) or libicuuc.so.69()(64bit) or libicuuc.so.67()(64bit) or libicuuc.so.65()(64bit))
      - (libssl.so.3()(64bit) or libssl.so.1.1()(64bit))
      - libX11.so.6()(64bit)
      - libICE.so.6()(64bit)
      - libSM.so.6()(64bit)
      - libXcursor.so.1()(64bit)
      - libXext.so.6()(64bit)
      - libXfixes.so.3()(64bit)
      - libXi.so.6()(64bit)
      - libXrandr.so.2()(64bit)
      - libfontconfig.so.1()(64bit)
    recommends:
      - libGL.so.1()(64bit)
      - libEGL.so.1()(64bit)
      - libgtk-3.so.0()(64bit)
