# Builds the Corvida.Api and Corvida.Web container images and publishes them to GitHub Container
# Registry, so a server can run Corvida with `podman`/`docker` (or the Quadlet units in
# packaging/quadlet/) without a checkout or a .NET SDK.
#
#   v* tag push      -> ghcr.io/<owner>/corvida-{api,web}:<version>, :<yy.m>, :latest
#   push to main     -> :edge, :sha-<short>
#   pull request     -> built only, never pushed
#   manual run       -> as for the ref it is run on
#
# <version> is the Nerdbank.GitVersioning version (version.json), the same number the .deb/.rpm
# packages carry, so a container and a package built from one commit share a version.
#
# A package pushed to GHCR for the first time is private. Make corvida-api and corvida-web public
# once (github.com/<owner>?tab=packages -> package -> Package settings), or pulling needs a login.

name: Container images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'licenses/**'
      - '.github/workflows/container-images.yml'
  workflow_dispatch:

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.nbgv.outputs.version }}
      minor: ${{ steps.nbgv.outputs.minor }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # NBGV derives the patch number from git height

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - id: nbgv
        run: |
          dotnet tool restore
          version=$(dotnet nbgv get-version -v SimpleVersion)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  image:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: corvida-api
            dockerfile: src/Corvida.Api/Dockerfile
            title: Corvida API
            description: Corvida REST API and SignalR hub (needs PostgreSQL)
          - name: corvida-web
            dockerfile: src/Corvida.Web/Dockerfile
            title: Corvida Web
            description: Corvida browser UI (WebAssembly on nginx, proxies the API on the same origin)
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ needs.version.outputs.minor }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
