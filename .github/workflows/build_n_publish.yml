# Builds the corvida .deb and .rpm (desktop app + MCP server, see packaging/build-packages.sh).
#
#   push to main / pull request -> tests, packages uploaded as a workflow artifact
#   v* tag push                 -> also a GitHub release v<version> with the packages attached
#   release made on github.com  -> the packages are attached to it
#   manual run with "publish"   -> tags the built commit v<version> and creates the release
#
# The container images are built by container-images.yml from the same tags, with the same version.

name: Build and publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a GitHub release (tag v<version>) with the packages'
        type: boolean
        default: false

concurrency:
  group: build-n-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PACKAGE_DIR: artifacts/packages

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Nerdbank.GitVersioning needs the full history to compute the git height

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        run: |
          dotnet tool restore
          echo "version=$(dotnet nbgv get-version -v SimpleVersion)" >> "$GITHUB_OUTPUT"

      # Only the test projects, not the whole solution: Corvida.Web (WasmBuildNative) would need the
      # wasm-tools workload and emscripten, and it is not part of the packages.
      # Corvida.Api.Tests starts PostgreSQL with Testcontainers, using the runner's Docker.
      # Polling file watcher: every WebApplicationFactory watches its config files, and with inotify that
      # exhausts the per-user instance limit (same as in build-packages.sh).
      - name: Test
        env:
          DOTNET_USE_POLLING_FILE_WATCHER: true
        run: |
          dotnet test src/Corvida.Core.Tests/Corvida.Core.Tests.csproj -c Release
          dotnet test src/Corvida.Api.Tests/Corvida.Api.Tests.csproj -c Release

      # nfpm is downloaded by build-packages.sh into artifacts/tools (checksum verified).
      - name: Cache nfpm
        uses: actions/cache@v4
        with:
          path: artifacts/tools
          key: nfpm-${{ hashFiles('packaging/build-packages.sh') }}

      # Publishes the self-contained desktop app and MCP server and builds both packages.
      # --no-bump: CI never rewrites version.json, it only warns when the month is outdated.
      - name: Build packages
        run: packaging/build-packages.sh --no-bump --skip-tests deb rpm

      - name: Upload packages
        uses: actions/upload-artifact@v5
        with:
          name: corvida-${{ steps.version.outputs.version }}-packages
          path: |
            ${{ env.PACKAGE_DIR }}/*.deb
            ${{ env.PACKAGE_DIR }}/*.rpm
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release (and its tag)
    steps:
      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          name: corvida-${{ needs.build.outputs.version }}-packages
          path: packages

      # A release created on github.com (which also pushes its tag) already exists: only attach the packages.
      # Otherwise (plain tag push or manual run) create the release.
      - name: Create release or attach packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.build.outputs.version) }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" packages/* --clobber
          else
            gh release create "$TAG" packages/* \
              --target "$GITHUB_SHA" \
              --title "Corvida ${{ needs.build.outputs.version }}" \
              --generate-notes
          fi
