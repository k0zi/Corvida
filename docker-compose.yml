services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: corvida
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d corvida"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: src
      dockerfile: Corvida.Api/Dockerfile
    restart: unless-stopped
    ports:
      - "5083:5083"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "5083"
      ConnectionStrings__CorvidaApi: >-
        Host=db;Database=corvida;Username=postgres;Password=${POSTGRES_PASSWORD:-changeme}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
